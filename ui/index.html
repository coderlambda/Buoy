<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Buoy</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <style>
    :root { --bg:#1e1e2e; --panel:#181825; --fg:#cdd6f4; --muted:#6c7086; --accent:#89b4fa; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font: 13px -apple-system, system-ui, sans-serif; }
    #app { display:flex; height:100vh; }
    #sidebar { width:240px; min-width:240px; background:var(--panel); border-right:1px solid #313244;
      display:flex; flex-direction:column; }
    #sidebar h1 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
      padding:12px 14px 6px; margin:0; }
    #sessions { list-style:none; margin:0; padding:0 6px; overflow-y:auto; flex:1; }
    .session { display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border-radius:6px;
      cursor:pointer; }
    .session:hover { background:#252537; }
    .session.active { background:#313244; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; margin-top:4px; }
    .dot.connected { background:#a6e3a1; } .dot.connecting { background:#f9e2af; }
    .dot.reconnecting { background:#fab387; } .dot.dead { background:#f38ba8; }
    .dot.closed { background:#6c7086; }
    .session .body { flex:1; min-width:0; display:flex; flex-direction:column; }
    /* first row: name (flexes) + action icons. Icons appear on hover and shrink ONLY this row,
       so the sub line and tunnel rows below keep full width. */
    .session .name-row { display:flex; align-items:center; gap:4px; min-width:0; }
    .session .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session .sub { font-size:10px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session .name .rename-input { width:100%; box-sizing:border-box; font:inherit; color:var(--fg);
      background:var(--bg); border:1px solid var(--accent); border-radius:4px; padding:1px 4px; }
    .session .retry { display:none; font-size:11px; color:var(--accent); flex:none; }
    .session.dead .retry { display:inline; }
    .session .act { display:none; flex:none; font-size:13px; color:var(--muted); cursor:pointer; padding:0 3px; }
    .session:hover .act { display:inline; }
    .session .act.detach:hover { color:var(--fg); }
    .session .act.kill:hover { color:#f38ba8; }
    /* §18: forwarded-port list under the project name */
    .session .tunnels { display:flex; flex-direction:column; gap:2px; margin-top:3px; }
    .session .tunnel { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--muted);
      background:#252537; border-radius:4px; padding:1px 5px; cursor:pointer; }
    .session .tunnel:hover { background:#2e2e44; color:var(--fg); }
    .session .tunnel .tport { color:#a6e3a1; font-weight:600; }   /* remote port (active) */
    /* inactive: persisted-but-not-serving — greyed, still closable/clickable to re-open */
    .session .tunnel.inactive { opacity:.5; }
    .session .tunnel.inactive .tport { color:var(--muted); }
    .session .tunnel .tarrow { opacity:.6; }
    .session .tunnel .tlocal { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session .tunnel .tlocal.same { color:#a6e3a1; }   /* local port == remote port (forced) */
    .session .tunnel .tforce, .session .tunnel .tclose { margin-left:2px; color:var(--muted);
      font-size:12px; visibility:hidden; flex:none; }
    .session .tunnel .tforce { margin-left:auto; }
    .session .tunnel:hover .tforce, .session .tunnel:hover .tclose { visibility:visible; }
    .session .tunnel .tforce:hover { color:var(--accent); }
    .session .tunnel .tclose:hover { color:#f38ba8; }
    #new { margin:10px; padding:8px; border:1px dashed #45475a; border-radius:6px; text-align:center;
      color:var(--muted); cursor:pointer; }
    #new:hover { color:var(--fg); border-color:var(--accent); }
    #main { flex:1; display:flex; flex-direction:column; min-width:0; }
    #tabs { display:none; gap:2px; padding:4px 6px 0; background:var(--panel); }
    #tabs.on { display:flex; }
    #tabs .tab { display:flex; align-items:center; gap:6px; padding:4px 10px; font-size:12px;
      color:var(--muted); background:var(--bg); border:1px solid #313244; border-bottom:none;
      border-radius:6px 6px 0 0; cursor:pointer; max-width:180px; }
    #tabs .tab.active { color:var(--fg); background:#313244; }
    #tabs .tab .tlabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #tabs .tab .tclose { color:var(--muted); font-size:13px; visibility:hidden; }
    #tabs .tab:hover .tclose { visibility:visible; }
    #tabs .tab .tclose:hover { color:#f38ba8; }
    #tabs .tab.plus { color:var(--muted); font-weight:bold; padding:4px 10px; }
    #tabs .tab.plus:hover { color:var(--accent); }
    #term { flex:1; padding:6px; min-height:0; }
    #status { height:22px; line-height:22px; padding:0 10px; background:var(--panel);
      color:var(--muted); font-size:11px; border-top:1px solid #313244; }
    dialog { background:var(--panel); color:var(--fg); border:1px solid #45475a; border-radius:8px; }
    dialog input, dialog select { width:100%; margin:4px 0 10px; padding:6px; background:var(--bg);
      color:var(--fg); border:1px solid #45475a; border-radius:4px; }
    dialog button { padding:6px 12px; margin-left:6px; }
    dialog label { font-size:12px; color:var(--muted); }
    .err { color:#f38ba8; font-size:11px; }
    .hint { font-size:11px; color:var(--muted); margin:-6px 0 10px; }
    .opt { color:var(--muted); font-weight:normal; }
    /* new-session: host input + history dropdown */
    #host-wrap { position:relative; }
    #host-history { list-style:none; margin:0; padding:4px; position:absolute; left:0; right:0; top:100%;
      z-index:20; background:var(--panel); border:1px solid #45475a; border-radius:6px; max-height:200px;
      overflow-y:auto; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4); }
    #host-history.on { display:block; }
    #host-history li { padding:6px 8px; border-radius:4px; cursor:pointer; font-size:12px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #host-history li:hover, #host-history li.sel { background:#313244; color:var(--fg); }
    /* native-mode toggle button */
    .toggle-row { display:flex; align-items:center; gap:8px; margin:2px 0 10px; }
    .toggle { position:relative; width:38px; height:22px; padding:0; margin:0; border-radius:11px;
      border:1px solid #45475a; background:var(--bg); cursor:pointer; flex:none; transition:background .15s; }
    .toggle .knob { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
      background:var(--muted); transition:transform .15s, background .15s; }
    .toggle.on { background:var(--accent); border-color:var(--accent); }
    .toggle.on .knob { transform:translateX(16px); background:#11111b; }
    .toggle-label { font-size:12px; color:var(--fg); }
    /* file viewer (§16) */
    .fv-root { display:flex; flex-direction:column; background:var(--bg); color:var(--fg); }
    .fv-bar { display:flex; align-items:center; gap:10px; padding:6px 10px; background:var(--panel);
      border-bottom:1px solid #313244; flex:none; }
    .fv-name { font-weight:600; }
    .fv-meta { color:var(--muted); font-size:11px; flex:1; }
    .fv-dl { padding:4px 10px; background:var(--accent); color:#11111b; border:none; border-radius:5px;
      cursor:pointer; font-size:12px; }
    .fv-dl:disabled { opacity:.6; cursor:default; }
    .fv-body { flex:1; overflow:auto; padding:12px; min-height:0; }
    .fv-text { margin:0; white-space:pre; font-family:Menlo,Consolas,monospace; font-size:12px;
      color:var(--fg); }
    .fv-img { max-width:100%; height:auto; image-rendering:auto; }
    .fv-msg { color:var(--muted); padding:20px; text-align:center; }
    .fv-err { color:#f38ba8; }
    .fv-md { font: 14px -apple-system,system-ui,sans-serif; line-height:1.5; max-width:820px; }
    .fv-md h1,.fv-md h2,.fv-md h3 { border-bottom:1px solid #313244; padding-bottom:.2em; }
    .fv-md code { background:var(--panel); padding:1px 5px; border-radius:4px;
      font-family:Menlo,Consolas,monospace; font-size:.9em; }
    .fv-md pre.mdcode { background:var(--panel); padding:10px; border-radius:6px; overflow:auto; }
    .fv-md pre.mdcode code { background:none; padding:0; }
    .fv-md a.mdlink { color:var(--accent); cursor:pointer; }
    /* URL open chooser (§18) */
    .chooser-back { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex;
      align-items:center; justify-content:center; z-index:50; }
    .chooser { background:var(--panel); border:1px solid #45475a; border-radius:8px; min-width:280px;
      max-width:70vw; padding:6px; box-shadow:0 8px 30px rgba(0,0,0,.4); }
    .chooser-title { font-size:11px; color:var(--muted); padding:6px 8px; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; }
    .chooser-item { display:block; width:100%; text-align:left; padding:8px 10px; margin:2px 0;
      background:var(--bg); color:var(--fg); border:1px solid #313244; border-radius:6px; cursor:pointer;
      font:inherit; }
    .chooser-item:hover { background:#313244; border-color:var(--accent); }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h1>Sessions</h1>
      <ul id="sessions"></ul>
      <div id="new">+ New session</div>
    </div>
    <div id="main">
      <div id="tabs"></div>
      <div id="term"></div>
      <div id="status">ready</div>
    </div>
  </div>

  <dialog id="dialog">
    <form method="dialog" id="form">
      <div><label>Type</label>
        <select id="f-kind">
          <option value="remote" selected>Remote host (ssh + tmux)</option>
          <option value="local">Local shell</option>
        </select></div>
      <div id="remote-fields">
        <label>Host</label>
        <div id="host-wrap">
          <input id="f-host" placeholder="user@host  or  user@host:port" autocomplete="off" />
          <ul id="host-history"></ul>
        </div>
        <div class="hint">Connects over ssh and keeps a persistent tmux session that
          reattaches automatically on reconnect.</div>
        <div class="toggle-row">
          <button type="button" id="f-control" class="toggle on" role="switch" aria-checked="true">
            <span class="knob"></span>
          </button>
          <span class="toggle-label">Native tabs <span class="opt">(tmux control mode — needs tmux ≥ 3.2)</span></span>
        </div>
      </div>
      <label>Name <span class="opt">(optional)</span></label><input id="f-title" placeholder="defaults to the host" />
      <div class="err" id="f-err"></div>
      <div style="text-align:right">
        <button value="cancel">Cancel</button>
        <button value="ok" id="f-ok">Create</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="tauri-api.js"></script>
  <script src="plugins.js"></script>
  <script src="builtinPlugins.js"></script>
  <script src="terminalTab.js"></script>
  <script src="fileViewerTab.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
