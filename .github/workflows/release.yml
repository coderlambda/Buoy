name: Release

# Build Buoy for macOS, Linux, and Windows on their NATIVE runners (Tauri can't cross-bundle),
# and attach the installers to a GitHub Release. Triggered by pushing a version tag (e.g. v0.1.0),
# or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write            # tauri-action needs this to create/upload the Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: universal binary (Intel + Apple Silicon in one .dmg/.app).
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Linux: .deb / .rpm / .AppImage (x86_64).
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          # Windows: .msi / .exe (x86_64).
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Linux build deps: WebKitGTK (the webview) + the bundling tools Tauri shells out to.
      # tauri-action installs most, but the webkit/gtk dev libs must be present first.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cache the Rust build so repeat releases are fast. Keyed on the platform + Cargo.lock.
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      # GitHub runners cannot access the certificate installed in the developer's local
      # Keychain. Import the exported identity into an ephemeral keychain. The job fails
      # instead of publishing an unsigned macOS build when a required secret is missing.
      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD secrets are required"
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/apple-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE" \
            | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F 'Developer ID Application: Yitong Jiang (P8MQ54R68J)'

      # Builds the app and, when a tag triggered the run, creates a GitHub Release and uploads
      # every bundle produced (dmg/app, deb/rpm/AppImage, msi/exe). No npm build step: the
      # frontend is the static ui/ directory (frontendDist), so there's nothing to compile there.
      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These values are empty on non-macOS matrix jobs. On macOS, the signing
          # identity is mandatory; the Apple account secrets also enable notarization.
          APPLE_SIGNING_IDENTITY: "${{ matrix.platform == 'macos-latest' && 'Developer ID Application: Yitong Jiang (P8MQ54R68J)' || '' }}"
          APPLE_ID: "${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}"
          APPLE_PASSWORD: "${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}"
          APPLE_TEAM_ID: "${{ matrix.platform == 'macos-latest' && 'P8MQ54R68J' || '' }}"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Buoy ${{ github.ref_name }}'
          releaseBody: |
            Buoy ${{ github.ref_name }}.

            Platform signing status:
            - macOS: Developer ID signed; notarized when Apple account secrets are configured.
            - Windows: unsigned; SmartScreen → More info → Run anyway.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
