[package]
name = "buoy"
version = "0.1.1"
description = "Buoy — durable remote terminal (ssh + tmux control mode) whose sessions resurface after network drops"
edition = "2021"
rust-version = "1.77.2"

# The Tauri app is a library + a thin binary, per Tauri v2 convention.
[lib]
name = "buoy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
buoy-core = { path = "../crates/buoy-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
dirs = "5"

[dev-dependencies]
libc = "0.2"

[features]
default = []
# Build-only UI automation surface. Production binaries do not contain the embedded WebDriver
# server or the deterministic renderer backend installed by this feature.
ui-test = ["dep:tauri-plugin-wdio-webdriver"]
