[package]
name = "durable-terminal"
version = "0.1.0"
description = "Durable remote terminal (ssh + tmux control mode) — Tauri port"
edition = "2021"
rust-version = "1.77"

# The Tauri app is a library + a thin binary, per Tauri v2 convention.
[lib]
name = "durable_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
dirs = "5"

[features]
# no custom features yet
default = []
