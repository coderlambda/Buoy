[package]
name = "buoy"
version = "0.1.0"
description = "Buoy — durable remote terminal (ssh + tmux control mode) whose sessions resurface after network drops"
edition = "2021"
rust-version = "1.77.2"

# The Tauri app is a library + a thin binary, per Tauri v2 convention.
[lib]
name = "buoy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
dirs = "5"

[features]
# no custom features yet
default = []
